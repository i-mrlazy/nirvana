    <!-- Back Outer Glow Rim on Silhouette -->
    <path d="M 960 170 
             C 995 170 1025 190 1025 225 
             C 1025 240 1015 255 1020 270 
             C 1040 280 1060 295 1070 315 
             C 1080 335 1075 355 1065 375 
             C 1090 385 1120 400 1140 430 
             C 1165 465 1180 505 1205 540 
             C 1225 565 1255 580 1285 590 
             C 1315 600 1310 630 1280 645 
             C 1230 670 1150 685 960 685 
             C 770 685 690 670 640 645 
             C 610 630 605 600 635 590 
             C 665 580 695 565 715 540 
             C 740 505 755 465 780 430 
             C 800 400 830 385 855 375 
             C 845 355 840 335 850 315 
             C 860 295 880 280 900 270 
             C 905 255 895 240 895 225 
             C 895 190 925 170 960 170 Z" fill="url(#shivaRimLight)" />

    <!-- Main Silhouette Path -->
    <!-- Matted Hair / Jata Mukuta Top -->
    <!-- Head & Neck -->
    <!-- Shoulders & Torso -->
    <!-- Folded Legs in Padmasana -->
    <path d="
      M 960 175
      C 972 175 985 182 988 195
      C 992 208 980 218 995 228
      C 1008 222 1018 235 1012 248
      C 1005 260 995 268 1002 278
      C 1018 285 1038 298 1048 315
      C 1058 332 1055 350 1048 368
      C 1060 372 1075 380 1085 392
      C 1105 415 1120 440 1135 468
      C 1148 492 1162 518 1182 538
      C 1205 560 1235 572 1262 582
      C 1282 590 1290 605 1282 618
      C 1272 630 1250 638 1225 646
      C 1180 660 1110 672 960 672
      C 810 672 740 660 695 646
      C 670 638 648 630 638 618
      C 630 605 638 590 658 582
      C 685 572 715 560 738 538
      C 758 518 772 492 785 468
      C 800 440 815 415 835 392
      C 845 380 860 372 872 368
      C 865 350 862 332 872 315
      C 882 298 902 285 918 278
      C 925 268 915 260 908 248
      C 902 235 912 222 925 228
      C 940 218 928 208 932 195
      C 935 182 948 175 960 175 Z
    " fill="#090103" stroke="#FF1A35" stroke-width="0.8" />

    <!-- Broad Chest & Athletic Muscular Lines (Subtle Silhouette Detailing) -->
    <!-- Collarbones & Neck -->
    <path d="M 935 310 Q 960 322 985 310" stroke="#FF334B" stroke-width="1.2" fill="none" opacity="0.4" />
    
    <!-- Pectoral Muscle Contours -->
    <path d="M 915 370 Q 955 388 960 388 Q 965 388 1005 370" stroke="#FF334B" stroke-width="1.2" fill="none" opacity="0.35" />
    <!-- Abdominal Midline -->
    <line x1="960" y1="388" x2="960" y2="480" stroke="#FF334B" stroke-width="1" opacity="0.3" />
    <!-- Bicep / Arm Contours -->
    <path d="M 880 375 Q 860 420 840 470 Q 820 520 800 555" stroke="#FF334B" stroke-width="1" fill="none" opacity="0.3" />
    <path d="M 1040 375 Q 1060 420 1080 470 Q 1100 520 1120 555" stroke="#FF334B" stroke-width="1" fill="none" opacity="0.3" />

    <!-- Meditating Hands Folded in Dhyana Mudra in Lap -->
    <ellipse cx="960" cy="565" rx="45" ry="22" fill="#070002" stroke="#FF334B" stroke-width="1" opacity="0.8" />
    <path d="M 930 560 Q 960 575 990 560" stroke="#FF5266" stroke-width="1.2" fill="none" opacity="0.6" />

    <!-- Crossed Knees Contours -->
    <path d="M 720 620 Q 790 570 870 580" stroke="#FF334B" stroke-width="1" fill="none" opacity="0.35" />
    <path d="M 1200 620 Q 1130 570 1050 580" stroke="#FF334B" stroke-width="1" fill="none" opacity="0.35" />

    <!-- Sacred Rudraksha Mala Threads -->
    <!-- Neck Mala -->
    <path d="M 930 325 Q 960 375 990 325" fill="none" stroke="#FF5266" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.8" />
    <path d="M 922 320 Q 960 395 998 320" fill="none" stroke="#FF334B" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.7" />
    <!-- Arm Bands -->
    <ellipse cx="865" cy="405" rx="14" ry="6" fill="none" stroke="#FF5266" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.8" />
    <ellipse cx="1055" cy="405" rx="14" ry="6" fill="none" stroke="#FF5266" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.8" />

    <!-- CRESCENT MOON & TRIPUNDRA ON FOREHEAD -->
    <g filter="url(#glow)">
      <!-- Tripundra (Three Horizontal White/Silver Sacred Lines) -->
      <line x1="942" y1="262" x2="978" y2="262" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
      <line x1="940" y1="267" x2="980" y2="267" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
      <line x1="944" y1="272" x2="976" y2="272" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
      
      <!-- Red Bindu / Third Eye Dot in Center -->
      <circle cx="960" cy="267" r="2.5" fill="#FF0022" />

      <!-- Crescent Moon (Chandra) tucked in hair -->
      <path d="M 982 230 A 14 14 0 0 1 992 252 A 11 11 0 0 0 982 230 Z" fill="#FFF8EE" />
    </g>
  </g>

  <!-- Foreground Vignette Gradient -->
  <rect width="1920" height="1080" fill="none" stroke="#2A0006" stroke-width="20" opacity="0.5" />
</svg>
